<section class="auth-shell">
    <div class="auth-card">
        <header class="auth-header">
            <p class="auth-eyebrow">ERP Workspace</p>
            <h1>Welcome back</h1>
            <p class="auth-subtitle">Sign in to manage your company operations.</p>
        </header>

        <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" autocomplete="email" />
                <mat-error *ngIf="emailControl.hasError('required')">Email is required.</mat-error>
                <mat-error *ngIf="emailControl.hasError('email')">Enter a valid email address.</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput type="password" formControlName="password" autocomplete="current-password" />
                <mat-error *ngIf="passwordControl.hasError('required')">Password is required.</mat-error>
                <mat-error *ngIf="passwordControl.hasError('minlength')">Password must be at least 6
                    characters.</mat-error>
            </mat-form-field>

            <button mat-flat-button color="primary" type="submit" class="submit-button"
                [disabled]="form.invalid || loading">
                <ng-container *ngIf="!loading; else loadingState">Login</ng-container>
                <ng-template #loadingState>
                    <span class="loading-wrap">
                        <mat-spinner diameter="18"></mat-spinner>
                        Signing in...
                    </span>
                </ng-template>
            </button>
        </form>

        <div class="auth-footer">
            <span>New to the ERP platform?</span>
            <a routerLink="/register">Create an account</a>
        </div>
    </div>
</section>
